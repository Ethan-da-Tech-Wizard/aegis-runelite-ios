[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-runelite-ios"
version = "1.0.0"
description = "Native Standalone & Headless Streamed RuneLite Client for iOS/iPadOS + AI Neural Gameplay Harness"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT OR Apache-2.0"}
authors = [
    {name = "TWU LLC"}
]
keywords = [
    "runelite",
    "ios",
    "oldschool-runescape",
    "osrs",
    "metal",
    "neural-gamer",
    "fps-benchmarking"
]
dependencies = []

[tool.setuptools.packages.find]
include = ["bridge_daemon*", "neural_harness*", "scripts*"]
